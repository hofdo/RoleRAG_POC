[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rolerag-poc"
version = "1.2.0"
description = "Personal RoleRAG proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Upper-bound the libraries whose next major could break the engine, matching the
  # deliberately-capped qdrant-client below. openai already resolves to 2.x (the chat
  # completions call the whole engine depends on); <3 guards the next major without
  # forcing a downgrade. See docs/BACKLOG.md #59.
  "fastapi>=0.115,<1",
  "httpx>=0.27",
  "openai>=1.40,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0",
  "qdrant-client[fastembed]>=1.18,<2",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
rolerag = "app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
