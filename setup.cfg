[metadata]
name = rolerag-poc
version = 0.1.0
description = Personal RoleRAG proof of concept

[options]
packages = find:
python_requires = >=3.12
install_requires =
    openai>=1.40
    pydantic>=2.8
    pydantic-settings>=2.4
    python-dotenv>=1.0
    qdrant-client[fastembed]>=1.18,<2
    rich>=13.7
    typer>=0.12

[options.extras_require]
dev =
    mypy>=1.11
    pytest>=8.3
    pytest-asyncio>=0.23
    ruff>=0.6

[options.entry_points]
console_scripts =
    rolerag=app.cli:main

[options.packages.find]
include =
    app*
