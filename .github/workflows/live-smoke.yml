name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: "JSON array of self-hosted runner labels."
        required: true
        default: '["self-hosted"]'
      local_base_url:
        description: "OpenAI-compatible local model base URL."
        required: true
        default: "http://127.0.0.1:8080/v1"
      local_model:
        description: "Model id that must be exposed by /v1/models."
        required: true
        default: "chatgpt-onnechan"
      api_port:
        description: "FastAPI port for the isolated live smoke."
        required: true
        default: "18080"
      qdrant_port:
        description: "Disposable Qdrant host port."
        required: true
        default: "6334"
      llama_server_path:
        description: "Optional llama-server binary path for managed llama.cpp startup."
        required: false
        default: ""
      llama_model_path:
        description: "Optional GGUF model path for managed llama.cpp startup."
        required: false
        default: ""
      llama_hf_model:
        description: "Hugging Face GGUF repo and quantization for managed startup."
        required: false
        default: "DavidAU/gemma-4-E4B-it-The-DECKARD-Expresso-Universe-HERETIC-UNCENSORED-Thinking-GGUF:Q8_0"
      llama_ctx_size:
        description: "Context size for managed llama.cpp startup."
        required: false
        default: ""
      llama_n_gpu_layers:
        description: "Optional --n-gpu-layers value for managed llama.cpp startup."
        required: false
        default: ""
      skip_browser:
        description: "Set to 1 to skip Playwright UI smoke."
        required: true
        default: "0"
      turn_count:
        description: "Rose Gallery conversation turns (5-50)."
        required: true
        default: "8"
      fail_on_structured_warnings:
        description: "Set to 1 to fail on critic, memory, indexing, or retrieval warnings."
        required: true
        default: "1"
  # Weekly self-hosted acceptance gate so live quality does not rot between manual
  # runs. Scheduled runs are a no-op unless the repo variable
  # ENABLE_SCHEDULED_LIVE_SMOKE is "true" (set it once a self-hosted runner with
  # the model server is online). Manual workflow_dispatch always runs and uses its
  # inputs; scheduled runs fall back to the defaults below.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  live-smoke:
    name: Disposable local stack
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_LIVE_SMOKE == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted"]') }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        if: ${{ inputs.skip_browser != '1' }}
        run: npx playwright install chromium

      - name: Validate live smoke inputs
        env:
          TURN_COUNT: ${{ inputs.turn_count || '8' }}
          FAIL_ON_STRUCTURED_WARNINGS: ${{ inputs.fail_on_structured_warnings || '1' }}
        run: |
          [[ "$TURN_COUNT" =~ ^[0-9]+$ ]] && (( TURN_COUNT >= 5 && TURN_COUNT <= 50 ))
          [[ "$FAIL_ON_STRUCTURED_WARNINGS" == "0" || "$FAIL_ON_STRUCTURED_WARNINGS" == "1" ]]

      - name: Run live smoke
        env:
          API_PORT: ${{ inputs.api_port || '18080' }}
          QDRANT_PORT: ${{ inputs.qdrant_port || '6334' }}
          LOCAL_LLM_BASE_URL: ${{ inputs.local_base_url || 'http://127.0.0.1:8080/v1' }}
          LOCAL_LLM_API_KEY: local
          LOCAL_LLM_MODEL: ${{ inputs.local_model || 'chatgpt-onnechan' }}
          LLAMA_CPP_SERVER_PATH: ${{ inputs.llama_server_path }}
          LLAMA_CPP_MODEL_PATH: ${{ inputs.llama_model_path }}
          LLAMA_CPP_HF_MODEL: ${{ inputs.llama_hf_model || 'DavidAU/gemma-4-E4B-it-The-DECKARD-Expresso-Universe-HERETIC-UNCENSORED-Thinking-GGUF:Q8_0' }}
          LLAMA_CPP_CTX_SIZE: ${{ inputs.llama_ctx_size }}
          LLAMA_CPP_N_GPU_LAYERS: ${{ inputs.llama_n_gpu_layers }}
          LIVE_SKIP_BROWSER: ${{ inputs.skip_browser || '0' }}
          LIVE_TURN_COUNT: ${{ inputs.turn_count || '8' }}
          LIVE_FAIL_ON_STRUCTURED_WARNINGS: ${{ inputs.fail_on_structured_warnings || '1' }}
          LIVE_ARTIFACT_DIR: /tmp/rolerag-live-test
          CLOUD_MODE: off
        run: bash scripts/live-smoke.sh

      - name: Upload live smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-artifacts
          path: /tmp/rolerag-live-test
          if-no-files-found: warn
