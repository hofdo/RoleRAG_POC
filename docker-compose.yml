services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    # Survive host reboots so the personal daily-driver stack comes back up.
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    # The qdrant/qdrant image ships no curl/wget/nc, but it does ship bash -- so
    # probe /readyz over bash's /dev/tcp. /bin/sh is dash (no /dev/tcp), hence the
    # explicit `bash`. A closed/unready port makes the connect fail non-zero, so the
    # check reports unhealthy rather than deadlocking the readiness gate below.
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      # Wait for Qdrant to be *ready* (healthcheck passing), not merely started --
      # otherwise the app can race ahead and hit a not-yet-serving vector store.
      qdrant:
        condition: service_healthy
    ports:
      - "${DEV_API_PORT:-8000}:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      # Model server runs on the HOST (see README "Run in Docker"); reach it via
      # host.docker.internal. Override if your server is elsewhere.
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-chatgpt-onnechan}
      CLOUD_MODE: ${CLOUD_MODE:-off}
    extra_hosts:
      # Lets the container resolve the host on Linux too (no-op on macOS/Windows).
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist the SQLite db and let you edit scenario content on the host.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/runtime/status"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
